aid: arcturus
name: Arcturus
description: 'Arcturus (Arcturus Technologies) is a Los Angeles advanced-materials company founded by
  Amir Mashal that infuses carbon nanomaterials into metals to create a new class of conductors, using
  lasers to embed carbon into copper and dramatically improve its electrical, thermal, and mechanical
  performance. Positioned in frontier climate/energy tech, its drop-in materials target motor windings,
  bus bars, heat sinks, data-center infrastructure, electric motors, drones, robotics, and — over time —
  transmission lines and grid infrastructure. The company emerged from stealth in June 2026 with an $8M
  seed round led by Initialized Capital, with 1517, Breakthrough Energy Discovery, Toyota Ventures, and
  Wireframe Ventures participating. This is a deep-tech hardware/materials company with no public API or
  developer program; the profile is maintained as an API Evangelist network company record.'
